<!DOCTYPE html>
<html lang="pt-PT">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Gerador de Códigos — Gestão de Negócio</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --teal:#0F766E;--teal-l:#E4F5F3;
  --red:#B91C1C;--red-l:#FCE8E8;
  --ink:#1C1917;--ink2:#57534E;
  --paper:#FAF7F1;--paper2:#FFFFFF;
  --line:rgba(28,25,23,.12);
  --radius:10px;
}
body{font-family:'Segoe UI',-apple-system,BlinkMacSystemFont,sans-serif;background:var(--paper);color:var(--ink);min-height:100vh;display:flex;align-items:center;justify-content:center;padding:1rem}
.box{background:var(--paper2);border:1px solid var(--line);border-radius:16px;box-shadow:0 4px 20px rgba(28,25,23,.08);padding:2rem;width:100%;max-width:420px}
h1{font-size:18px;margin-bottom:4px}
.sub{font-size:12px;color:var(--ink2);margin-bottom:1.25rem}
.form-group{margin-bottom:.85rem}
label{display:block;font-size:11px;font-weight:600;color:var(--ink2);margin-bottom:4px}
input{width:100%;padding:9px 10px;border:1px solid var(--line);border-radius:var(--radius);font-size:13px;background:var(--paper)}
input:focus{outline:2px solid var(--teal);outline-offset:1px}
button{width:100%;padding:10px;border:none;border-radius:var(--radius);background:var(--teal);color:#fff;font-size:13px;font-weight:600;cursor:pointer;margin-top:.35rem}
button:disabled{opacity:.6;cursor:default}
button.secondary{background:transparent;color:var(--ink2);border:1px solid var(--line);margin-top:.6rem}
.msg-err{display:none;background:var(--red-l);color:var(--red);border-radius:var(--radius);padding:8px 10px;font-size:12px;margin-bottom:10px}
.msg-ok{display:none;background:var(--teal-l);color:var(--teal);border-radius:var(--radius);padding:8px 10px;font-size:12px;margin-bottom:10px}
.hidden{display:none !important}
.link-out{display:flex;gap:.5rem;margin-top:.6rem}
.link-out input{background:var(--teal-l);color:var(--teal);font-weight:600}
.link-out button{width:auto;padding:9px 14px;margin-top:0}
#adminBox{max-width:960px}
h2{font-size:14px;margin-bottom:.75rem}
table{width:100%;border-collapse:collapse;font-size:12px}
th{text-align:left;padding:6px 8px;border-bottom:1px solid var(--line);font-size:11px;color:var(--ink2)}
td{padding:6px 8px;border-bottom:1px solid var(--line);vertical-align:middle}
td input[type=date]{width:auto;padding:5px}
td button{width:auto;padding:5px 8px;font-size:10px;margin:0 4px 0 0;background:var(--ink2)}
.badge{padding:2px 8px;border-radius:8px;font-size:10px;font-weight:700;white-space:nowrap}
.tabela-wrap{overflow-x:auto}
</style>
</head>
<body>

<div class="box" id="loginBox">
  <h1>Gerador de Códigos</h1>
  <div class="sub">Entra com a tua conta de administrador</div>
  <div class="msg-err" id="loginErr"></div>
  <div class="form-group">
    <label>Email</label>
    <input type="email" id="loginEmail" placeholder="o-teu-email@exemplo.com">
  </div>
  <div class="form-group">
    <label>Password</label>
    <input type="password" id="loginPass">
  </div>
  <button id="loginBtn" onclick="doLogin()">Entrar</button>
</div>

<div class="box hidden" id="adminBox">
  <h1>Gerador de Códigos</h1>
  <div class="sub" id="adminSub">Cria um link de acesso para um cliente novo</div>
  <div class="msg-err" id="adminErr"></div>
  <div class="msg-ok" id="adminOk"></div>
  <div id="adminForm">
    <div class="form-group">
      <label>Nome do cliente</label>
      <input type="text" id="nomeCliente" placeholder="Ex: João Tombola">
    </div>
    <button id="gerarBtn" onclick="gerarCodigo()">Gerar link</button>
    <div class="link-out hidden" id="linkWrap">
      <input type="text" id="linkGerado" readonly onclick="this.select()">
      <button onclick="copiarLink()">Copiar</button>
    </div>
  </div>

  <div style="margin-top:1.5rem;padding-top:1rem;border-top:1px solid var(--line)">
    <h2>Clientes e anuidades</h2>
    <div class="msg-err" id="listaMsg"></div>
    <div class="tabela-wrap">
      <table id="tabelaClientes">
        <thead>
          <tr>
            <th>Cliente</th>
            <th>Código</th>
            <th>Email</th>
            <th>Último acesso</th>
            <th>Validade</th>
            <th>Estado</th>
            <th></th>
          </tr>
        </thead>
        <tbody id="tabelaClientesBody"></tbody>
      </table>
    </div>
  </div>

  <button class="secondary" onclick="doLogout()">Terminar sessão</button>
</div>

<script>
const SUPA_URL='https://xkfshzlcwiuvztfdwvjm.supabase.co';
const SUPA_KEY='sb_publishable_SGjww6C455tzA6wpIevT-w_t2X9lqMJ';
const supaClient=window.supabase.createClient(SUPA_URL,SUPA_KEY);

function show(id){document.getElementById(id).classList.remove('hidden');}
function hide(id){document.getElementById(id).classList.add('hidden');}
function setErr(id,msg){const el=document.getElementById(id); if(msg){el.textContent=msg; el.style.display='block';} else {el.style.display='none';}}

function traduzErro(error){
  const m=(error&&error.message)||'';
  if(/invalid login credentials/i.test(m))return'Email ou password incorretos.';
  if(/email not confirmed/i.test(m))return'Confirma primeiro o teu email.';
  return m||'Ocorreu um erro. Tenta novamente.';
}

async function doLogin(){
  const email=document.getElementById('loginEmail').value.trim();
  const pass=document.getElementById('loginPass').value;
  setErr('loginErr','');
  const btn=document.getElementById('loginBtn');
  btn.disabled=true; btn.textContent='A entrar...';
  try{
    const{error}=await supaClient.auth.signInWithPassword({email,password:pass});
    if(error){ setErr('loginErr',traduzErro(error)); }
    // sucesso: onAuthStateChange trata do resto
  }catch(e){ setErr('loginErr','Erro de ligação. Tenta novamente.'); }
  btn.disabled=false; btn.textContent='Entrar';
}

async function doLogout(){
  await supaClient.auth.signOut();
  hide('adminBox'); show('loginBox');
  document.getElementById('loginPass').value='';
}

async function checkAdminAndShow(){
  try{
    const{data,error}=await supaClient.rpc('sou_admin');
    if(error||!data){
      document.getElementById('adminSub').textContent='Esta conta não tem acesso a esta ferramenta.';
      hide('adminForm');
      setErr('adminErr','A tua conta iniciou sessão, mas não tem permissão para gerar códigos.');
    }else{
      document.getElementById('adminSub').textContent='Cria um link de acesso para um cliente novo';
      show('adminForm');
      setErr('adminErr','');
      carregarClientes();
    }
  }catch(e){
    setErr('adminErr','Não foi possível confirmar a permissão. Tenta novamente.');
    hide('adminForm');
  }
}

function formatarDataHora(iso){
  if(!iso)return'Nunca entrou';
  const d=new Date(iso);
  return d.toLocaleDateString('pt-PT')+' '+d.toLocaleTimeString('pt-PT',{hour:'2-digit',minute:'2-digit'});
}
function estadoValidade(validade){
  if(!validade)return{label:'Sem validade definida',color:'var(--ink2)',bg:'#EFEBE3'};
  const hoje=new Date(); hoje.setHours(0,0,0,0);
  const v=new Date(validade+'T00:00:00');
  const dias=Math.round((v-hoje)/86400000);
  if(dias<0)return{label:'Expirado',color:'var(--red)',bg:'var(--red-l)'};
  if(dias<=30)return{label:'Termina em '+dias+' dia'+(dias===1?'':'s'),color:'#B45309',bg:'#FCEEDC'};
  return{label:'Ativo',color:'var(--teal)',bg:'var(--teal-l)'};
}
async function carregarClientes(){
  setErr('listaMsg','');
  try{
    const{data,error}=await supaClient.rpc('listar_clientes_admin');
    const body=document.getElementById('tabelaClientesBody');
    if(error){ setErr('listaMsg','Não foi possível carregar a lista.'); return; }
    if(!data||!data.length){ body.innerHTML='<tr><td colspan="7" style="color:var(--ink2)">Ainda não geraste nenhum código.</td></tr>'; return; }
    body.innerHTML=data.map(row=>{
      const est=estadoValidade(row.validade);
      const codigoSeguro=row.codigo.replace(/"/g,'&quot;');
      const usado=!!row.usado_por_email;
      const bloqueado=!!row.bloqueado;
      return `<tr data-codigo="${codigoSeguro}">
        <td>${row.cliente||'—'}</td>
        <td style="font-family:monospace;font-size:11px">${row.codigo}</td>
        <td style="font-size:11px">${row.usado_por_email?row.usado_por_email:'<em>por usar</em>'}</td>
        <td style="font-size:11px">${formatarDataHora(row.ultimo_acesso)}</td>
        <td><input type="date" value="${row.validade||''}" class="inp-validade"></td>
        <td>
          <span class="badge" style="background:${est.bg};color:${est.color}">${est.label}</span>
          ${bloqueado?'<span class="badge" style="background:var(--red-l);color:var(--red);margin-left:4px">Bloqueado</span>':''}
        </td>
        <td style="white-space:nowrap">
          <div>
            <button onclick="ajustarValidade('${codigoSeguro}',1)">+1 ano</button>
            <button onclick="ajustarValidade('${codigoSeguro}',2)">+2 anos</button>
            <button onclick="guardarValidadeManual('${codigoSeguro}',this)">Guardar</button>
          </div>
          <div style="margin-top:4px">
            ${usado
              ? `<button style="background:${bloqueado?'var(--teal)':'var(--red)'}" onclick="alternarBloqueio('${codigoSeguro}',${!bloqueado})">${bloqueado?'Desbloquear':'Bloquear acesso'}</button>`
              : `<button style="background:var(--red)" onclick="eliminarCodigo('${codigoSeguro}')">Eliminar</button>`}
          </div>
        </td>
      </tr>`;
    }).join('');
  }catch(e){ setErr('listaMsg','Erro de ligação.'); }
}
async function ajustarValidade(codigo,anos){
  const linha=document.querySelector('tr[data-codigo="'+CSS.escape(codigo)+'"]');
  const inp=linha?linha.querySelector('.inp-validade'):null;
  const hoje=new Date(); hoje.setHours(0,0,0,0);
  let base=(inp&&inp.value)?new Date(inp.value+'T00:00:00'):hoje;
  if(base<hoje)base=hoje;
  base.setFullYear(base.getFullYear()+anos);
  const nova=base.toISOString().slice(0,10);
  await salvarValidade(codigo,nova);
}
async function guardarValidadeManual(codigo,btn){
  const linha=btn.closest('tr');
  const inp=linha.querySelector('.inp-validade');
  await salvarValidade(codigo,inp.value||null);
}
async function salvarValidade(codigo,dataStr){
  try{
    const{data,error}=await supaClient.rpc('atualizar_validade_codigo',{p_codigo:codigo,p_validade:dataStr});
    if(error||!data){ setErr('listaMsg','Não foi possível guardar a validade.'); return; }
    carregarClientes();
  }catch(e){ setErr('listaMsg','Erro de ligação.'); }
}

async function alternarBloqueio(codigo,bloquear){
  if(bloquear && !confirm('Bloquear o acesso deste cliente? Ele deixa logo de conseguir usar a app, até desbloqueares.'))return;
  try{
    const{data,error}=await supaClient.rpc('alternar_bloqueio_cliente',{p_codigo:codigo,p_bloquear:bloquear});
    if(error||!data){ setErr('listaMsg','Não foi possível atualizar o bloqueio.'); return; }
    carregarClientes();
  }catch(e){ setErr('listaMsg','Erro de ligação.'); }
}
async function eliminarCodigo(codigo){
  if(!confirm('Eliminar este código de acesso? Só é possível se ainda não tiver sido usado. Esta ação não pode ser desfeita.'))return;
  try{
    const{data,error}=await supaClient.rpc('eliminar_codigo_ativacao',{p_codigo:codigo});
    if(error||!data){ setErr('listaMsg','Não foi possível eliminar (só é possível eliminar códigos ainda não usados).'); return; }
    carregarClientes();
  }catch(e){ setErr('listaMsg','Erro de ligação.'); }
}

async function gerarCodigo(){
  const nome=document.getElementById('nomeCliente').value.trim();
  setErr('adminErr',''); document.getElementById('adminOk').style.display='none'; hide('linkWrap');
  if(!nome){ setErr('adminErr','Escreve o nome do cliente.'); return; }
  const btn=document.getElementById('gerarBtn');
  btn.disabled=true; btn.textContent='A gerar...';
  try{
    const{data,error}=await supaClient.rpc('criar_codigo_ativacao',{p_cliente:nome});
    if(error||!data){
      setErr('adminErr','Não foi possível gerar. Tenta novamente.');
    }else{
      document.getElementById('linkGerado').value='https://gerirmais.com/?codigo='+encodeURIComponent(data);
      show('linkWrap');
      document.getElementById('nomeCliente').value='';
      carregarClientes();
    }
  }catch(e){ setErr('adminErr','Erro de ligação. Tenta novamente.'); }
  btn.disabled=false; btn.textContent='Gerar link';
}

function copiarLink(){
  const inp=document.getElementById('linkGerado'); if(!inp.value)return;
  inp.select(); inp.setSelectionRange(0,99999);
  try{ if(navigator.clipboard)navigator.clipboard.writeText(inp.value); }catch(e){}
  const ok=document.getElementById('adminOk'); ok.textContent='Link copiado!'; ok.style.display='block';
  setTimeout(()=>{ok.style.display='none';},2000);
}

supaClient.auth.onAuthStateChange((event,session)=>{
  if(event==='SIGNED_IN'&&session){
    hide('loginBox'); show('adminBox');
    checkAdminAndShow();
  }
  if(event==='SIGNED_OUT'){
    hide('adminBox'); show('loginBox');
  }
});

(async function start(){
  const{data}=await supaClient.auth.getSession();
  if(data&&data.session){ hide('loginBox'); show('adminBox'); checkAdminAndShow(); }
})();
</script>
</body>
</html>
