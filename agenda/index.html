<style>
:root{
  --bg:#eef2f0; --surface:#ffffff; --surface-2:#e5ece8;
  --ink:#16202e; --ink-muted:#5a6676; --line:#d3dbd7; --line-strong:#b3c0ba;
  --primary:#6b3fa0; --primary-dark:#542f80; --primary-contrast:#ffffff;
  --blue:#1f4f8f;
  --ok:#2c7a4b; --ok-bg:#e2f3e8; --warn:#9a5b00; --warn-bg:#fbefd9; --danger:#b23a2e; --danger-bg:#f8e3e0;
  --l1:#c0392b; --l1-bg:#fbe5e2; --l2:#b8860b; --l2-bg:#fdf3d6; --l3:#2e7d32; --l3-bg:#e3f2e4; --l4:#1f4f8f; --l4-bg:#e1eaf7;
  --shadow:0 1px 2px rgba(18,32,52,.06),0 10px 28px -14px rgba(18,32,52,.28);
  --font-display:'Bricolage Grotesque','Segoe UI',system-ui,sans-serif;
  --font-ui:'Source Sans 3','Segoe UI',Helvetica,Arial,sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0f1714; --surface:#17211d; --surface-2:#1f2c27; --ink:#e8efec; --ink-muted:#9fb3aa; --line:#2b3b35; --line-strong:#3c5048;
    --primary:#b896e6; --primary-dark:#9d78d1; --primary-contrast:#0b1611; --blue:#7aa7e6;
    --ok:#6cc893; --ok-bg:#183326; --warn:#f0b35a; --warn-bg:#3a2b12; --danger:#f08a7e; --danger-bg:#3d1f1b;
    --l1:#f08a7e; --l1-bg:#3d1f1b; --l2:#f0c45a; --l2-bg:#3a3010; --l3:#7fd38a; --l3-bg:#183326; --l4:#8db5ef; --l4-bg:#17273d;
    --shadow:0 1px 2px rgba(0,0,0,.4),0 10px 28px -14px rgba(0,0,0,.6); color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0f1714; --surface:#17211d; --surface-2:#1f2c27; --ink:#e8efec; --ink-muted:#9fb3aa; --line:#2b3b35; --line-strong:#3c5048;
  --primary:#b896e6; --primary-dark:#9d78d1; --primary-contrast:#0b1611; --blue:#7aa7e6;
  --ok:#6cc893; --ok-bg:#183326; --warn:#f0b35a; --warn-bg:#3a2b12; --danger:#f08a7e; --danger-bg:#3d1f1b;
  --l1:#f08a7e; --l1-bg:#3d1f1b; --l2:#f0c45a; --l2-bg:#3a3010; --l3:#7fd38a; --l3-bg:#183326; --l4:#8db5ef; --l4-bg:#17273d;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 10px 28px -14px rgba(0,0,0,.6); color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0;min-height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--font-ui);font-size:15px;line-height:1.45}
h1,h2,h3{font-family:var(--font-display);margin:0;letter-spacing:-.01em}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--primary);outline-offset:2px}

/* topo */
.topbar{display:flex;align-items:center;gap:10px;padding:10px 16px;background:var(--surface);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:30}
.brand{display:flex;align-items:center;gap:10px;min-width:0}
.brand-mark{width:34px;height:34px;border-radius:8px;background:var(--primary);color:var(--primary-contrast);display:grid;place-items:center;font-family:var(--font-display);font-weight:800;font-size:17px;flex:none}
.brand h1{font-size:18px;font-weight:800;line-height:1.1}
.brand .sub{font-size:12px;color:var(--ink-muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.top-right{margin-left:auto;display:flex;align-items:center;gap:8px}
.pill{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:600;padding:4px 10px;border-radius:99px;border:1px solid var(--line-strong);color:var(--ink-muted);background:var(--surface);white-space:nowrap;cursor:pointer}
.pill .dot{width:8px;height:8px;border-radius:50%;background:var(--ink-muted)}
.pill.ok{color:var(--ok);border-color:var(--ok);background:var(--ok-bg)} .pill.ok .dot{background:var(--ok)}
.pill.warn{color:var(--warn);border-color:var(--warn);background:var(--warn-bg)} .pill.warn .dot{background:var(--warn)}
.pill.err{color:var(--danger);border-color:var(--danger);background:var(--danger-bg)} .pill.err .dot{background:var(--danger)}
.pill.busy .dot{animation:pulse 1s infinite alternate}
@keyframes pulse{from{opacity:1}to{opacity:.2}}
.turma-sel{border:1px solid var(--line-strong);border-radius:8px;padding:6px 8px;background:var(--surface);font-weight:600;max-width:180px}
.avatar{width:34px;height:34px;border-radius:50%;border:none;background:var(--blue);color:#fff;font-weight:700}
.ver{font-size:11px;color:var(--ink-muted);border:1px solid var(--line);border-radius:99px;padding:1px 7px}

/* separadores */
.tabs{display:flex;gap:4px;padding:8px 16px;background:var(--surface);border-bottom:1px solid var(--line);overflow-x:auto;scrollbar-width:none;position:sticky;top:55px;z-index:25}
.tabs::-webkit-scrollbar{display:none}
.tab{border:1px solid transparent;background:none;border-radius:99px;padding:6px 14px;font-weight:700;color:var(--ink-muted);white-space:nowrap}
.tab:hover{background:var(--surface-2)}
.tab.on{background:var(--primary);color:var(--primary-contrast)}

.main{max-width:1100px;margin:0 auto;padding:16px 16px 80px;display:flex;flex-direction:column;gap:14px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px 16px;box-shadow:var(--shadow)}
.card h2{font-size:17px;margin-bottom:8px}
.card h3{font-size:15px;margin:10px 0 6px}
.muted{color:var(--ink-muted);font-size:13px}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.grow{flex:1}

/* botões e campos */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:1px solid transparent;border-radius:8px;padding:8px 13px;font-weight:600;font-size:14px;white-space:nowrap;background:none}
.btn-primary{background:var(--primary);color:var(--primary-contrast)}
.btn-primary:hover{background:var(--primary-dark)}
.btn-ghost{border-color:var(--line-strong);background:var(--surface)}
.btn-ghost:hover{background:var(--surface-2)}
.btn-danger{border-color:var(--danger);color:var(--danger);background:var(--surface)}
.btn-sm{padding:5px 9px;font-size:13px;border-radius:7px}
.btn[disabled]{opacity:.5;cursor:not-allowed}
.icon-btn{border:1px solid transparent;background:none;border-radius:6px;padding:2px 7px;color:var(--ink-muted)}
.icon-btn:hover{background:var(--surface-2);color:var(--ink);border-color:var(--line)}
.icon-btn.del:hover{background:var(--danger-bg);color:var(--danger);border-color:var(--danger)}
input[type=text],input[type=email],input[type=tel],input[type=time],input[type=password],input[type=number],input[type=date],select,textarea{border:1px solid var(--line-strong);border-radius:8px;padding:7px 9px;background:var(--surface);min-width:0}
textarea{width:100%;resize:vertical}
select{max-width:100%}
.card{min-width:0;overflow-wrap:anywhere}
label.f{min-width:0;max-width:100%;display:flex;flex-direction:column;gap:3px;font-size:13px;font-weight:600;color:var(--ink-muted)}
label.f input,label.f select{color:var(--ink);font-weight:400;font-size:15px}

/* chips */
.chips{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px;scrollbar-width:thin}
.chip{border:1px solid var(--line-strong);background:var(--surface);border-radius:99px;padding:6px 12px;font-weight:600;font-size:13.5px;white-space:nowrap}
.chip:hover{background:var(--surface-2)}
.chip.on{background:var(--primary);border-color:var(--primary);color:var(--primary-contrast)}
.chip.dps.on{background:var(--blue);border-color:var(--blue)}
.seg{display:inline-flex;border:1px solid var(--line-strong);border-radius:9px;overflow:hidden}
.seg button{border:none;background:var(--surface);padding:7px 12px;font-weight:600;font-size:13.5px}
.seg button.on{background:var(--primary);color:var(--primary-contrast)}

/* registo */
.reg-head{display:flex;flex-direction:column;gap:10px;position:sticky;top:104px;z-index:20}
.stu-list{display:flex;flex-direction:column;gap:6px}
.stu{display:flex;align-items:center;gap:10px;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:8px 10px}
.stu .n{flex:1;min-width:0}
.stu .n b{display:block;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.stu .n small{color:var(--ink-muted);font-size:12px}
.stu .cod{font-size:12px;font-weight:700;color:var(--ink-muted);width:30px;flex:none}
.lv{display:flex;gap:5px;flex:none}
.lv button{width:46px;height:40px;border-radius:9px;border:1.5px solid var(--line-strong);background:var(--surface);font-weight:800;font-size:14px;color:var(--ink-muted)}
.lv button[data-l="1"].on{background:var(--l1-bg);border-color:var(--l1);color:var(--l1)}
.lv button[data-l="2"].on{background:var(--l2-bg);border-color:var(--l2);color:var(--l2)}
.lv button[data-l="3"].on{background:var(--l3-bg);border-color:var(--l3);color:var(--l3)}
.lv button[data-l="4"].on{background:var(--l4-bg);border-color:var(--l4);color:var(--l4)}
.pct{width:84px;text-align:center;font-weight:700;font-size:16px}
.bulk{background:var(--surface-2);border-style:dashed}

/* resumo */
.tbl-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:10px;background:var(--surface)}
table.res{border-collapse:collapse;width:100%;font-size:14px}
table.res th,table.res td{border-bottom:1px solid var(--line);padding:7px 8px;text-align:center;white-space:nowrap}
table.res th{background:var(--surface-2);font-size:12.5px;position:sticky;top:0}
table.res td.nm,table.res th.nm{text-align:left;position:sticky;left:0;background:var(--surface);z-index:1;max-width:190px;overflow:hidden;text-overflow:ellipsis}
table.res th.nm{background:var(--surface-2);z-index:2}
.mb{display:inline-flex;flex-direction:column;align-items:center;gap:1px;border:none;background:none;padding:2px 4px;border-radius:7px;min-width:52px}
.mb:hover{background:var(--surface-2)}
.badge{display:inline-block;min-width:34px;padding:2px 7px;border-radius:7px;font-weight:800;font-size:13px}
.b1{background:var(--l1-bg);color:var(--l1)} .b2{background:var(--l2-bg);color:var(--l2)} .b3{background:var(--l3-bg);color:var(--l3)} .b4{background:var(--l4-bg);color:var(--l4)} .b0{background:var(--surface-2);color:var(--ink-muted)}
.mb small{font-size:11px;color:var(--ink-muted)}
.mb .ovr{outline:2px solid var(--ink);outline-offset:1px}
.apr{display:flex;flex-direction:column;gap:8px}
.apr-item{border:1px solid var(--line);border-radius:10px;padding:10px;background:var(--surface)}
.apr-item b{font-size:14.5px}
.prop-tag{font-size:12px;font-weight:700;color:var(--warn);margin-top:4px}
.lvl-line{display:flex;flex-wrap:wrap;gap:4px;margin:6px 0}
.lvl-line span{font-size:12px;border-radius:6px;padding:1px 6px}

/* critérios */
.disc{border:1px solid var(--line);border-radius:10px;padding:10px;margin-bottom:10px;background:var(--surface)}
.dom-row{display:grid;grid-template-columns:1fr 78px 30px;gap:6px;margin:4px 0}
.dom-row input[type=number]{text-align:right}
.sum{font-size:12.5px;font-weight:700}
.sum.bad{color:var(--danger)} .sum.ok{color:var(--ok)}
.per-row{display:grid;grid-template-columns:1.2fr auto auto auto 30px;gap:8px;margin:6px 0;align-items:end;padding:8px;border:1px solid var(--line);border-radius:10px}
.per-row label{display:flex;flex-direction:column;gap:2px;font-size:12px}
.per-row label.ic{flex-direction:row;align-items:center;flex-wrap:wrap;gap:4px}
.per-row.int{background:var(--surface-2)}
.warnbox{background:var(--warn-bg);color:var(--warn);border:1px solid var(--warn);border-radius:8px;padding:7px 10px;font-size:13px;font-weight:600;margin-top:8px}
.alu-row{display:grid;grid-template-columns:42px 1fr 30px;gap:6px;margin:3px 0;align-items:center}

/* janela */
.modal-bg{position:fixed;inset:0;background:rgba(10,20,16,.45);z-index:200;display:flex;align-items:center;justify-content:center;padding:16px}
.modal{background:var(--surface);border-radius:14px;max-width:560px;width:100%;max-height:88vh;overflow-y:auto;padding:18px;box-shadow:0 20px 60px rgba(0,0,0,.35)}
.modal h3{font-size:17px;margin-bottom:8px}
.modal table.res th,.modal table.res td{white-space:normal}
.modal .row{flex-wrap:nowrap}
.modal select{width:100%}
.modal-foot{display:flex;justify-content:flex-end;gap:8px;margin-top:14px}
.toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);background:#1c2a24;color:#fff;padding:10px 16px;border-radius:10px;z-index:300;font-weight:600;box-shadow:var(--shadow);max-width:92vw}

/* entrada */
.gate{position:fixed;inset:0;background:var(--bg);z-index:150;display:flex;align-items:center;justify-content:center;padding:16px}
.gate-card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:22px;max-width:400px;width:100%;box-shadow:var(--shadow);display:flex;flex-direction:column;gap:10px}
.gate-card input{width:100%}
.gate-err{color:var(--danger);font-size:13px;min-height:1em}
.empty{text-align:center;padding:26px 10px;color:var(--ink-muted)}

@media (max-width:700px){
  .brand .sub,.brand h1{display:none}
  .topbar{padding:8px 10px;gap:6px}
  .tabs{top:51px;padding:6px 10px}
  .reg-head{top:96px}
  .main{padding:12px 10px 80px}
  .lv button{width:42px;height:42px}
  #drivePill span:last-child{display:none}
  .per-row{grid-template-columns:1fr 1fr;}
  .per-row input[type=text]{grid-column:1/-1}
}
@media print{
  .topbar,.tabs,.no-print,.toast,.gate{display:none!important}
  body{background:#fff;color:#000;font-size:11pt}
  .main{max-width:none;padding:0}
  .card{box-shadow:none;border:none;padding:0}
  .tbl-wrap{overflow:visible;border:none}
  table.res th,table.res td{border:1px solid #888;padding:3px 5px}
  table.res th,table.res td.nm{position:static}
  .badge{background:none!important;color:#000!important;padding:0}
  @page{size:A4 landscape;margin:12mm}
}
</style>

<style>
/* agenda */
.cal-head{display:flex;align-items:center;gap:8px;margin-bottom:10px}
.cal-head h2{margin:0;flex:1;text-transform:capitalize}
a.btn{text-decoration:none;color:inherit}
.hor .short{display:none}
.hor td.tm .ts{color:var(--ink-muted);margin:0 1px}
.month{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.month .wd{font-size:12px;font-weight:700;color:var(--ink-muted);text-align:center;padding:2px 0}
.day{min-height:88px;border:1px solid var(--line);border-radius:8px;background:var(--surface);padding:4px 5px;text-align:left;display:flex;flex-direction:column;gap:2px;overflow:hidden;cursor:pointer;font:inherit;color:inherit}
.day:hover{border-color:var(--line-strong)}
.day.out{opacity:.45}
.day.today{outline:2px solid var(--primary);outline-offset:-1px}
.day.sel{background:var(--surface-2)}
.day.int{background:repeating-linear-gradient(135deg,var(--surface),var(--surface) 6px,var(--surface-2) 6px,var(--surface-2) 12px)}
.day.fer .dn{color:var(--danger)}
.day .dn{font-weight:800;font-size:13px}
.day .ev{font-size:11.5px;line-height:1.25;border-radius:4px;padding:1px 4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.day .tag{font-size:10.5px;color:var(--ink-muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.t-reuniao{background:#e1eaf7;color:#1f4f8f} .t-visita{background:#e3f2e4;color:#2e7d32} .t-teste{background:#fbe5e2;color:#b23a2e} .t-entrega{background:#fdf3d6;color:#8a6200} .t-outro{background:#efe7f8;color:#6b3fa0} .t-aniv{background:#fde6f1;color:#a3326a}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]) .t-reuniao{background:#17273d;color:#8db5ef} :root:not([data-theme="light"]) .t-visita{background:#183326;color:#7fd38a} :root:not([data-theme="light"]) .t-teste{background:#3d1f1b;color:#f08a7e} :root:not([data-theme="light"]) .t-entrega{background:#3a3010;color:#f0c45a} :root:not([data-theme="light"]) .t-outro{background:#2a1f3a;color:#c9a6f0} :root:not([data-theme="light"]) .t-aniv{background:#3a1a2a;color:#f39cc6} }
.legend{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px;font-size:12px}
.legend span{padding:1px 7px;border-radius:5px}
.dayp{display:flex;flex-direction:column;gap:8px}
.item{display:flex;align-items:flex-start;gap:8px;border:1px solid var(--line);border-radius:9px;padding:7px 9px;background:var(--surface)}
.item .grow b{display:block}
.item small{color:var(--ink-muted)}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px}
.hor{border-collapse:collapse;width:100%;table-layout:fixed;font-size:13.5px}
.hor th,.hor td{border:1px solid var(--line);padding:0;height:46px;text-align:center}
.hor th{background:var(--surface-2);font-size:12.5px;padding:4px}
.hor td.tm{width:110px;font-size:12px;padding:2px 4px;background:var(--surface-2)}
.hor td.tm input{width:44px;border:none;background:transparent;text-align:center;font-size:12.5px;padding:2px 0;font-variant-numeric:tabular-nums}
.hor td button.cell{width:100%;height:100%;border:none;background:none;font-weight:700;font-size:13px;padding:2px}
.hor td button.cell:hover{outline:2px solid var(--line-strong);outline-offset:-2px}
.hor tr.now td{box-shadow:inset 0 0 0 9999px rgba(107,63,160,.06)}
.dot{width:10px;height:10px;border-radius:50%;display:inline-block;flex:none;margin-top:5px}
.task{display:flex;align-items:center;gap:10px;border:1px solid var(--line);border-radius:9px;padding:8px 10px;background:var(--surface);margin:5px 0}
.task input[type=checkbox]{width:20px;height:20px;flex:none}
.task.done .tx{text-decoration:line-through;color:var(--ink-muted)}
.task .tx{flex:1;min-width:0}
.task small{color:var(--ink-muted);display:block}
.task.late small{color:var(--danger);font-weight:700}
.prio{font-size:11px;font-weight:800;border-radius:5px;padding:1px 6px}
.prio.a{background:var(--danger-bg);color:var(--danger)}
.grp-t{font-size:12px;font-weight:800;color:var(--ink-muted);text-transform:uppercase;letter-spacing:.06em;margin:14px 0 4px}
.ct{display:grid;grid-template-columns:1.2fr 1.2fr 1fr 1.4fr 70px 30px;gap:6px;align-items:center;margin:4px 0}
.ct-h{font-size:12px;font-weight:700;color:var(--ink-muted)}
.lockbox{background:var(--surface-2);border:1px dashed var(--line-strong);border-radius:10px;padding:14px;text-align:center}
.priv{background:var(--ok-bg);color:var(--ok);border:1px solid var(--ok);border-radius:9px;padding:8px 11px;font-size:13px;font-weight:600}
@media (max-width:700px){
  .day{min-height:58px;padding:3px}
  .day .ev{font-size:0;height:6px;padding:0;border-radius:3px}
  .day .tag{display:none}
  .month{gap:2px}
  .hor{font-size:12px}
  .hor th:first-child{width:56px!important}
  .hor td.tm{width:56px;padding:2px 0}
  .hor td.tm input{width:48px;display:block;margin:0 auto;font-size:12px}
  .hor td.tm .ts{display:none}

var enc=new TextEncoder(), dec=new TextDecoder();
function b64(u){ var s=""; u=new Uint8Array(u); for(var i=0;i<u.length;i++) s+=String.fromCharCode(u[i]); return btoa(s); }
function unb64(s){ var b=atob(s), u=new Uint8Array(b.length); for(var i=0;i<b.length;i++) u[i]=b.charCodeAt(i); return u; }
function chave(pin, salt){ return crypto.subtle.importKey("raw", enc.encode(pin), "PBKDF2", false, ["deriveKey"]).then(function(k){ return crypto.subtle.deriveKey({name:"PBKDF2", salt:salt, iterations:200000, hash:"SHA-256"}, k, {name:"AES-GCM", length:256}, false, ["encrypt","decrypt"]); }); }
function cifrar(obj, pin){ var salt=crypto.getRandomValues(new Uint8Array(16)), iv=crypto.getRandomValues(new Uint8Array(12));
  return chave(pin, salt).then(function(k){ return crypto.subtle.encrypt({name:"AES-GCM", iv:iv}, k, enc.encode(JSON.stringify(obj))); }).then(function(ct){ return {salt:b64(salt), iv:b64(iv), data:b64(ct)}; }); }
function decifrar(c, pin){ return chave(pin, unb64(c.salt)).then(function(k){ return crypto.subtle.decrypt({name:"AES-GCM", iv:unb64(c.iv)}, k, unb64(c.data)); }).then(function(pt){ return JSON.parse(dec.decode(pt)); }); }
function guardarCofre(){ if(!state.data.cofre || state.cofreAberto==null || !state.pin) return Promise.resolve();

/* ---------------- GOOGLE DRIVE ---------------- */
var auth={token:null, exp:0, lastTry:0};
function tokKey(){ return "planificacao_gtok:"+(emailKey()||"local"); }
function tokSave(){ try{ if(auth.token && Date.now()<auth.exp) localStorage.setItem(tokKey(), JSON.stringify({t:auth.token, e:auth.exp})); else localStorage.removeItem(tokKey()); }catch(e){} }
function tokLoad(){ try{ var o=JSON.parse(localStorage.getItem(tokKey())||"null"); if(o && o.t && Date.now()<o.e){ auth.token=o.t; auth.exp=o.e; return true; } }catch(e){} return false; }
function waitGIS(){ return new Promise(function(res,rej){ var n=0; (function chk(){ if(window.google&&google.accounts&&google.accounts.oauth2) res(); else if(++n>60) rej({code:"nogis"}); else setTimeout(chk,150); })(); }); }
function getToken(interactive){
  if(auth.token && Date.now()<auth.exp) return Promise.resolve(auth.token);
  if(!interactive) return Promise.reject({code:"auth"});
  return waitGIS().then(function(){ return new Promise(function(res,rej){ var d=state.data.definicoes;
    var cl=google.accounts.oauth2.initTokenClient({client_id:GOOGLE_CLIENT_ID, scope:SCOPE, login_hint:d.conta||undefined,
      callback:function(r){ if(r&&r.access_token){ auth.token=r.access_token; auth.exp=Date.now()+((+r.expires_in||3600)-120)*1000; tokSave(); res(auth.token); } else rej({code:(r&&r.error)||"auth"}); },
      error_callback:function(err){ rej({code:(err&&err.type)||"auth"}); }});
    cl.requestAccessToken({prompt:"", login_hint:d.conta||undefined}); }); });
}
function api(method, url, body, headers, as){
  if(!navigator.onLine) return Promise.reject({code:"offline"});
  return getToken(false).then(function(tok){ return fetch(url,{method:method, headers:Object.assign({Authorization:"Bearer "+tok}, headers||{}), body:body}); })
  .then(function(r){ if(r.status===401){ auth.token=null; tokSave(); throw {code:"auth"}; }
    if(!r.ok) return r.text().then(function(t){ var m=""; try{ m=JSON.parse(t).error.message; }catch(e){ m=t.slice(0,160); } throw {code:"http", status:r.status, message:m}; });
    if(as==="text") return r.text(); return r.status===204? null : r.json(); });
}
function qv(s){ return String(s).replace(/\\/g,"\\\\").replace(/'/g,"\\'"); }
function driveErr(e){ var c=e&&e.code;
  if(c==="popup_closed"||c==="popup_failed_to_open") return "A janela da Google fechou ou foi bloqueada. Permite janelas pop-up e tenta outra vez.";
  if(c==="auth") return "A sessão da Google terminou. Carrega em “Entrar com Google”."; if(c==="offline") return "Sem internet. Fica guardado neste aparelho.";
  if(c==="mismatch") return "Entraste na Google com outra conta ("+state.drive.owner+")."; if(c==="http") return "A Drive respondeu com erro ("+e.status+")."; return "Falhou a ligação à Drive."; }
function renderPill(){ var p=$("drivePill"), t=$("drivePillTxt"), dr=state.drive, d=state.data&&state.data.definicoes; if(!d) return; p.className="pill";
  if(dr.saving||dr.status==="busy"){ p.classList.add("busy"); t.textContent="a guardar…"; return; }
  if(dr.status==="ok"){ p.classList.add(dr.pending?"warn":"ok"); t.textContent= dr.pending? "por enviar" : "Drive · "+(dr.lastSave? hm(dr.lastSave) : "ligada"); return; }
  if(dr.status==="error"){ p.classList.add("err"); t.textContent="erro na Drive"; return; }
  p.classList.add("warn"); t.textContent= d.driveLigada? "ligar à Drive" : "só neste aparelho"; }
$("drivePill").onclick=function(){ if(state.drive.status==="ok") driveSave(true); else if(state.data.definicoes.driveLigada) driveConnect(true); else { state.view="defs"; renderTabs(); renderMain(); } };
function ensureFolder(){ var name=state.data.definicoes.pasta||"Planificações", q="name = '"+qv(name)+"' and mimeType = '"+FOLDER_MIME+"' and trashed = false";
  return api("GET", API+"/files?fields=files(id,name)&q="+encodeURIComponent(q)).then(function(r){ if(r.files&&r.files.length) return r.files[0].id;
    return api("POST", API+"/files?fields=id", JSON.stringify({name:name, mimeType:FOLDER_MIME}), {"Content-Type":"application/json"}).then(function(x){ return x.id; }); }).then(function(id){ state.drive.folderId=id; return id; }); }
function findFile(){ var q="name = '"+DATA_FILE+"' and '"+qv(state.drive.folderId)+"' in parents and trashed = false";
  return api("GET", API+"/files?orderBy=modifiedTime desc&fields=files(id,modifiedTime)&q="+encodeURIComponent(q)).then(function(r){ return (r.files||[])[0]||null; }); }
function createFile(meta, content){ var bnd="agd"+Math.random().toString(36).slice(2);
  var body=new Blob(["--"+bnd+"\r\nContent-Type: application/json; charset=UTF-8\r\n\r\n"+JSON.stringify(meta)+"\r\n--"+bnd+"\r\nContent-Type: application/json\r\n\r\n", content, "\r\n--"+bnd+"--"]);
  return api("POST", UP+"/files?uploadType=multipart&fields=id", body, {"Content-Type":"multipart/related; boundary="+bnd}); }
function driveConnect(interactive){
  var d=state.data.definicoes, dr=state.drive; dr.status="busy"; dr.msg=""; renderPill();
  return getToken(interactive).then(function(){ return api("GET", API+"/about?fields=user(emailAddress)"); })
  .then(function(ab){ dr.owner=(ab&&ab.user&&ab.user.emailAddress)||""; if(d.conta && dr.owner && d.conta.toLowerCase()!==dr.owner.toLowerCase()) throw {code:"mismatch"}; if(!d.conta) d.conta=dr.owner; return ensureFolder(); })
  .then(function(){ d.driveLigada=true; return findFile(); })
  .then(function(f){ dr.fileId=f? f.id : null; if(!f){ dr.status="ok"; return driveSave(false); }
    return api("GET", API+"/files/"+f.id+"?alt=media", null, null, "text").then(function(txt){ var remote=normalize(JSON.parse(txt)); dr.status="ok";
      if(String(remote.atualizadoEm||"") > String(state.data.atualizadoEm||"")){ remote.definicoes.conta=d.conta; remote.definicoes.driveLigada=true; remote.definicoes.pasta=d.pasta; state.data=remote; state.cofreAberto=null; saveLocal(); renderAll(); toast("Carreguei a tua agenda da Drive."); }
      else if(String(remote.atualizadoEm||"") < String(state.data.atualizadoEm||"")) return driveSave(false); }); })
  .then(function(){ dr.lastSave=dr.lastSave||new Date(); renderPill(); if(state.view==="defs") renderDefs(); })
  .catch(function(e){ if(e&&e.code==="auth"&&!interactive){ dr.status="local"; renderPill(); return; } dr.status="error"; dr.msg=driveErr(e); renderPill(); if(interactive) toast(dr.msg,5000); if(state.view==="defs") renderDefs(); });
}
function scheduleDrive(){ var d=state.data.definicoes, dr=state.drive; if(!d.driveLigada || dr.status!=="ok") return; if(!dr.pending) dr.since=Date.now(); dr.pending=true; renderPill(); clearTimeout(dr.timer); dr.timer=setTimeout(function(){ driveSave(false); }, (Date.now()-dr.since>45000)? 0 : 4000); }
function driveSave(manual){
  var dr=state.drive; saveLocal(); if(dr.status!=="ok"){ if(manual) toast("Guardado neste aparelho."); return Promise.resolve(); }
  if(dr.saving){ dr.again=true; return Promise.resolve(); } clearTimeout(dr.timer); dr.saving=true; renderPill();
  var json=JSON.stringify(state.data);
  var p= dr.fileId? api("PATCH", UP+"/files/"+dr.fileId+"?uploadType=media&fields=id", new Blob([json],{type:"application/json"}), {"Content-Type":"application/json"})
    : (dr.folderId? Promise.resolve(dr.folderId) : ensureFolder()).then(function(fid){ return createFile({name:DATA_FILE, parents:[fid], mimeType:"application/json"}, json); }).then(function(r){ dr.fileId=r.id; });
  return p.then(function(){ dr.saving=false; dr.pending=false; dr.lastSave=new Date(); renderPill(); if(manual) toast("Guardado na Drive."); })
  .catch(function(e){ dr.saving=false; if(e&&e.code==="auth") dr.status="local"; else { dr.status="error"; dr.msg=driveErr(e); } renderPill(); if(manual) toast(driveErr(e),5000); })
  .then(function(){ if(dr.again){ dr.again=false; return driveSave(false); } });
}
setInterval(function(){ if(state.data && state.drive.pending && state.drive.status==="ok" && !state.drive.saving) driveSave(false); }, 60000);
document.addEventListener("pointerdown", function(e){ if(!state.started) return; var d=state.data.definicoes, dr=state.drive;
  if(!d.driveLigada || dr.status==="ok" || dr.status==="busy" || dr.saving) return; if(e.target.closest("input,textarea,select,#drivePill,#drvGo,.modal")) return;
  if(auth.token && Date.now()<auth.exp){ driveConnect(false); return; } if(Date.now()-auth.lastTry<90000) return; auth.lastTry=Date.now(); driveConnect(true); }, true);
/* fecha o cofre dos contactos quando a aplicação fica escondida muito tempo */
var hidAt=0; document.addEventListener("visibilitychange", function(){ if(document.hidden) hidAt=Date.now(); else if(state.cofreAberto!=null && Date.now()-hidAt>5*60000){ guardarCofre().then(function(){ state.cofreAberto=null; state.pin=null; if(state.view==="contactos") renderContactos(); }); } });


/* ---------------- LEMBRETES ---------------- */
/* 1) ficheiro .ics: o calendário do telemóvel/computador (Google, Apple, Outlook) avisa mesmo com a agenda fechada */
function icsTxt(t){ return String(t||"").replace(/\\/g,"\\\\").replace(/;/g,"\;").replace(/,/g,"\\,").replace(/\r?\n/g,"\\n"); }
function icsDT(iso, hhmm){ return iso.replace(/-/g,"")+"T"+hhmm.replace(":","")+"00"; }
function baixarIcs(evs, nome){
  var L=["BEGIN:VCALENDAR","VERSION:2.0","PRODID:-//gerirmais//Agenda do Professor//PT","CALSCALE:GREGORIAN"], stamp=new Date().toISOString().replace(/[-:]/g,"").slice(0,15)+"Z";
  evs.forEach(function(e){
    L.push("BEGIN:VEVENT","UID:"+e.id+"@gerirmais.com","DTSTAMP:"+stamp);
    if(e.hora){ L.push("DTSTART;TZID=Europe/Lisbon:"+icsDT(e.data,e.hora)); L.push("DTEND;TZID=Europe/Lisbon:"+icsDT(e.data, e.horaFim||e.hora)); }
    else { L.push("DTSTART;VALUE=DATE:"+e.data.replace(/-/g,"")); L.push("DTEND;VALUE=DATE:"+addDays(e.data,1).replace(/-/g,"")); }
    L.push("SUMMARY:"+icsTxt(e.titulo)); if(e.notas) L.push("DESCRIPTION:"+icsTxt(e.notas));
    if(e.lembrete!=null){ var trg; if(e.hora) trg="-PT"+e.lembrete+"M"; else { var off=540-e.lembrete; trg=(off<0?"-":"")+"PT"+Math.abs(off)+"M"; } /* dia inteiro: conta a partir das 9h */
      L.push("BEGIN:VALARM","ACTION:DISPLAY","DESCRIPTION:"+icsTxt(e.titulo),"TRIGGER:"+trg,"END:VALARM"); }
    L.push("END:VEVENT");
  });
  L.push("END:VCALENDAR");
  var url=URL.createObjectURL(new Blob([L.join("\r\n")],{type:"text/calendar;charset=utf-8"})), a=document.createElement("a");
  a.href=url; a.download=(nome||"agenda")+".ics"; document.body.appendChild(a); a.click(); setTimeout(function(){ URL.revokeObjectURL(url); a.remove(); },1500);
  toast("Abre o ficheiro descarregado para o juntar ao calendário.", 4000);
}
/* 2) avisos no próprio aparelho, enquanto a agenda estiver aberta (ou em segundo plano) */
var swReg=null;
if("serviceWorker" in navigator && location.protocol==="https:") navigator.serviceWorker.register("sw.js").then(function(r){ swReg=r; }).catch(function(){});
function avisosLigados(){ return state.data && state.data.definicoes.avisos && window.Notification && Notification.permission==="granted"; }
function notificar(titulo, corpo, tag){
  try{
    if(swReg && swReg.showNotification) return swReg.showNotification(titulo, {body:corpo, tag:tag, icon:"icon-192.png", badge:"icon-192.png"});
    new Notification(titulo, {body:corpo, tag:tag, icon:"icon-192.png"});
  }catch(e){ toast(titulo+" — "+corpo, 8000); }
}
function jaAvisado(k){ try{ var o=JSON.parse(localStorage.getItem(LS_KEY+":avisados")||"{}"); return !!o[k]; }catch(e){ return false; } }
function marcarAvisado(k){ try{ var o=JSON.parse(localStorage.getItem(LS_KEY+":avisados")||"{}"); o[k]=today(); var lim=addDays(today(),-10); Object.keys(o).forEach(function(x){ if(o[x]<lim) delete o[x]; }); localStorage.setItem(LS_KEY+":avisados", JSON.stringify(o)); }catch(e){} }
function verificarLembretes(){
  if(!state.data) return; var agora=Date.now(), t=today();
  state.data.eventos.forEach(function(e){
    if(e.lembrete==null) return;
    var ini=e.hora? new Date(e.data+"T"+e.hora+":00").getTime() : new Date(e.data+"T09:00:00").getTime(), quando=ini-e.lembrete*60000, k="e:"+e.id+":"+e.lembrete;
    if(agora>=quando && agora<ini+30*60000 && !jaAvisado(k)){ marcarAvisado(k); var txt=(e.hora? "Às "+e.hora : "Hoje")+(e.data!==t? " de "+fmtD(e.data) : "")+(e.notas? " · "+e.notas : "");
      if(avisosLigados()) notificar("📅 "+e.titulo, txt, k); else toast("📅 "+e.titulo+" — "+txt, 8000); }
  });
  var h=new Date().getHours();
  if(h>=8){ state.data.tarefas.forEach(function(x){ if(x.feita || !x.prazo || x.prazo>t) return; var k="t:"+x.id+":"+t; if(jaAvisado(k)) return; marcarAvisado(k);
    var msg= x.prazo<t? "Atrasada desde "+fmtD(x.prazo) : "Prazo: hoje"; if(avisosLigados()) notificar("✓ "+x.texto, msg, k); else toast("✓ "+x.texto+" — "+msg, 8000); }); }
  if(h>=8 && state.data.definicoes.mostrarAniv){ anivsDia(t).forEach(function(a){ var k="a:"+a.id+":"+t; if(jaAvisado(k)) return; marcarAvisado(k); if(avisosLigados()) notificar("🎂 Aniversário", a.nome+" faz anos hoje.", k); }); }
}
setInterval(verificarLembretes, 30000);
setTimeout(verificarLembretes, 3000);
document.addEventListener("visibilitychange", function(){ if(!document.hidden) verificarLembretes(); });

window.__agenda={state:state, feriados:feriados, pascoa:pascoa};
boot();
})();

</script>

<script>
(function(){

  var apps=[["planificacao","Planificação","Planificação semanal","#1f4f8f","P"],["agenda","Agenda","Calendário, horário e tarefas","#6b3fa0","G"]];
  function clamp(x,y){ var w=fab.offsetWidth||54, h=fab.offsetHeight||54; return [Math.max(6,Math.min(innerWidth-w-6,x)), Math.max(6,Math.min(innerHeight-h-6,y))]; }
  function place(x,y){ var p=clamp(x,y); fab.style.left=p[0]+"px"; fab.style.top=p[1]+"px"; fab.style.bottom="auto"; }
  try{ var s=JSON.parse(localStorage.getItem(KEY)||"null"); if(s) place(s.x*innerWidth, s.y*innerHeight); }catch(e){}
  addEventListener("resize", function(){ if(fab.style.top){ var r=fab.getBoundingClientRect(); place(r.left, r.top); } });
  var st=null;
  fab.addEventListener("pointerdown", function(e){ var r=fab.getBoundingClientRect(); st={x:e.clientX, y:e.clientY, l:r.left, t:r.top, moved:false}; fab.setPointerCapture(e.pointerId); });
  fab.addEventListener("pointermove", function(e){ if(!st) return; var dx=e.clientX-st.x, dy=e.clientY-st.y; if(!st.moved && Math.abs(dx)+Math.abs(dy)<6) return; st.moved=true; fab.classList.add("drag"); closeMenu(); place(st.l+dx, st.t+dy); });
  fab.addEventListener("pointerup", function(e){ if(!st) return; var moved=st.moved; st=null; fab.classList.remove("drag");
    if(moved){ var r=fab.getBoundingClientRect(); try{ localStorage.setItem(KEY, JSON.stringify({x:r.left/innerWidth, y:r.top/innerHeight})); }catch(x){} return; }
    menu? closeMenu() : openMenu(); });
  var _o=openMenu; openMenu=function(){ _o(); fab.classList.add("open"); }; var _c=closeMenu; closeMenu=function(){ _c(); fab.classList.remove("open"); };
  function closeMenu(){ if(menu){ menu.remove(); menu=null; } }

    menu.innerHTML='<div class="gm-t">gerirmais.com</div>'+apps.map(function(a){ var on=here.replace(/\/[^\/]*$/,"").split("/").pop()===a[0]; return '<a role="menuitem" href="../'+a[0]+'/" class="'+(on?"on":"")+'"><span class="ic" style="background:'+a[3]+'">'+a[4]+'</span><span>'+a[1]+'<small>'+a[2]+'</small></span></a>'; }).join("");
    document.body.appendChild(menu);
    var r=fab.getBoundingClientRect(), mw=menu.offsetWidth, mh=menu.offsetHeight;

  }
  document.addEventListener("pointerdown", function(e){ if(menu && !menu.contains(e.target) && e.target!==fab && !fab.contains(e.target)) closeMenu(); });
