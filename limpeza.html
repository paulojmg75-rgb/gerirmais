<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#2FB5A5">
<meta name="robots" content="noindex,nofollow">
<meta name="referrer" content="no-referrer">
<title>Limpezas</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Limpezas">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="apple-touch-icon" href="limpeza-180.png">
<link rel="icon" type="image/png" href="limpeza-192.png">
<style>
:root{--bg:#F3EDE3;--card:#fff;--ink:#1F1C18;--ink2:#6B645A;--ink3:#9A9286;--line:#E4DBCC;
  --accent:#2FB5A5;--accent-d:#1F8F82;--red:#D6453D;--amber:#E0952B;--ok:#3FA96F}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{min-height:100%}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;background:var(--bg);color:var(--ink);font-size:16px;line-height:1.4;padding-bottom:calc(30px + env(safe-area-inset-bottom))}
button,textarea{font:inherit;color:inherit}button{cursor:pointer}
.hide{display:none!important}
header{position:sticky;top:0;z-index:5;background:var(--accent);color:#fff;padding:calc(12px + env(safe-area-inset-top)) 16px 12px;display:flex;align-items:center;gap:12px;box-shadow:0 2px 10px rgba(0,0,0,.08)}
header img{width:38px;height:38px;border-radius:10px;box-shadow:0 0 0 2px rgba(255,255,255,.35)}
header h1{font-size:19px;line-height:1.1}header p{font-size:13px;opacity:.9}
header .rf{margin-left:auto;background:rgba(255,255,255,.18);border:0;color:#fff;border-radius:10px;width:40px;height:40px;font-size:19px}
main{max-width:560px;margin:0 auto;padding:14px 14px 0}
.inst{display:flex;align-items:center;gap:10px;width:100%;background:#fff;border:2px dashed var(--accent);color:var(--accent-d);border-radius:14px;padding:12px 14px;font-weight:700;font-size:16px;margin-bottom:14px;text-align:left}
.inst span{font-size:24px}
h2{font-size:13px;text-transform:uppercase;letter-spacing:.06em;color:var(--ink2);margin:18px 2px 8px}
.card{background:var(--card);border-radius:16px;padding:14px;margin-bottom:10px;box-shadow:0 1px 3px rgba(0,0,0,.06);border-left:7px solid var(--accent)}
.card .top{display:flex;align-items:baseline;justify-content:space-between;gap:10px}
.card .im{font-size:20px;font-weight:800}
.card .dt{font-size:14px;color:var(--ink2);white-space:nowrap}
.card .st{font-size:14px;color:var(--ink2);margin-top:4px}
.big{display:block;width:100%;border:0;border-radius:14px;padding:17px;font-size:20px;font-weight:800;margin-top:12px;color:#fff;background:var(--accent)}
.big.fim{background:var(--red)}.big:disabled{opacity:.5}
.timer{font-size:30px;font-weight:800;color:var(--red);margin-top:6px;font-variant-numeric:tabular-nums}
.lnk{background:none;border:0;color:var(--ink2);text-decoration:underline;font-size:14px;margin-top:10px;padding:4px}
.mini{display:flex;align-items:center;gap:10px;background:var(--card);border-radius:12px;padding:11px 12px;margin-bottom:7px;font-size:15px}
.mini .dot{width:12px;height:12px;border-radius:50%;flex:none}
.mini b{flex:1}.mini small{color:var(--ink2);font-size:13px;text-align:right}
.ok{color:var(--ok);font-weight:700}
.empty{text-align:center;color:var(--ink2);padding:26px 10px;background:var(--card);border-radius:16px}
.aviso{background:#fff;border-radius:16px;padding:22px 18px;text-align:center;margin-top:30px}
.aviso h3{font-size:20px;margin-bottom:8px}
.rod{text-align:center;color:var(--ink3);font-size:12px;margin-top:22px}
.ov{position:fixed;inset:0;background:rgba(20,18,15,.45);display:flex;align-items:flex-end;justify-content:center;z-index:20}
.sheet{background:#fff;width:100%;max-width:560px;border-radius:20px 20px 0 0;padding:20px 18px calc(20px + env(safe-area-inset-bottom));max-height:92vh;overflow:auto}
.sheet h3{font-size:20px;margin-bottom:6px}
.sheet p{color:var(--ink2);font-size:15px}
.sheet textarea{width:100%;border:1.5px solid var(--line);border-radius:12px;padding:10px;margin-top:10px;font-size:16px;resize:vertical}
.acts{display:flex;gap:10px;margin-top:16px}
.acts button{flex:1;border-radius:12px;padding:14px;font-size:17px;font-weight:700;border:1.5px solid var(--line);background:#fff}
.acts .pri{background:var(--accent);border-color:var(--accent);color:#fff}.acts .red{background:var(--red);border-color:var(--red);color:#fff}
ol.passos{margin:12px 0 0 0;padding-left:0;list-style:none;counter-reset:p}
ol.passos li{counter-increment:p;display:flex;gap:12px;align-items:flex-start;margin-bottom:12px;font-size:16px}
ol.passos li:before{content:counter(p);flex:none;width:28px;height:28px;border-radius:50%;background:var(--accent);color:#fff;font-weight:800;display:flex;align-items:center;justify-content:center}
.ico{display:inline-flex;align-items:center;justify-content:center;min-width:28px;height:28px;border-radius:7px;background:#EEF5F4;border:1px solid #CFE6E2;font-weight:700;padding:0 5px;vertical-align:middle}
.nota{font-size:13px;background:#FFF7E6;border-radius:10px;padding:9px 11px;margin-top:10px;color:#7A5A12}
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom));transform:translateX(-50%);background:#1F1C18;color:#fff;padding:12px 18px;border-radius:12px;font-size:15px;z-index:30;max-width:92vw;text-align:center}
</style>
</head>
<body>
<header>
  <img src="limpeza-192.png" alt="">
  <div><h1>Limpezas</h1><p id="ola">A carregar…</p></div>
  <button class="rf" onclick="carregar(true)" title="Atualizar" aria-label="Atualizar">↻</button>
</header>
<main id="main"></main>

<!-- confirmar início / fim -->
<div id="mConf" class="ov hide" onclick="if(event.target===this)fecharConf()"><div class="sheet">
  <h3 id="cfTit"></h3><p id="cfTxt"></p>
  <textarea id="cfNota" rows="3" maxlength="500" placeholder="Alguma observação? (opcional) Ex.: falta detergente, toalha manchada…" class="hide"></textarea>
  <div class="acts"><button onclick="fecharConf()">Cancelar</button><button id="cfOk" class="pri"></button></div>
</div></div>

<!-- pôr o ícone no telemóvel -->
<div id="mInst" class="ov hide" onclick="if(event.target===this)fecharInst()"><div class="sheet">
  <h3>📲 Pôr o ícone no telemóvel</h3>
  <div id="instTxt"></div>
  <div class="acts"><button class="pri" onclick="fecharInst()">Percebi</button></div>
</div></div>

<div id="toast" class="toast hide"></div>

<script>
'use strict';
const SUPA_URL='https://xkfshzlcwiuvztfdwvjm.supabase.co';
const SUPA_KEY='sb_publishable_SGjww6C455tzA6wpIevT-w_t2X9lqMJ';   // chave pública (a segurança está nas funções da base de dados)
const LS='gal_limpeza_link';
const $=id=>document.getElementById(id);
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const DS=['domingo','segunda','terça','quarta','quinta','sexta','sábado'];
const MS=['jan','fev','mar','abr','mai','jun','jul','ago','set','out','nov','dez'];
const pd=s=>{const[a,b,c]=s.split('-').map(Number);return Date.UTC(a,b-1,c);};
const addD=(s,n)=>new Date(pd(s)+n*864e5).toISOString().slice(0,10);
const hora=t=>new Date(t).toLocaleTimeString('pt-PT',{hour:'2-digit',minute:'2-digit'});
const dur=ms=>{const m=Math.max(0,Math.round(ms/6e4));return Math.floor(m/60)+'h'+String(m%60).padStart(2,'0');};
function toast(t,ms){const e=$('toast');e.textContent=t;e.classList.remove('hide');clearTimeout(toast._t);toast._t=setTimeout(()=>e.classList.add('hide'),ms||3000);}

/* ---------- o link (fica guardado neste telemóvel) ---------- */
let TOKEN=null;
(function(){
  const q=new URLSearchParams(location.search).get('c');
  const ok=s=>/^[A-Za-z0-9_-]{32,128}$/.test(s||'');
  let guardado=null;try{guardado=localStorage.getItem(LS);}catch(e){}
  if(ok(q)){TOKEN=q;try{localStorage.setItem(LS,q);}catch(e){}}
  else if(ok(guardado))TOKEN=guardado;
})();

/* ---------- ligação à base de dados ---------- */
async function rpc(fn,args){
  const r=await fetch(SUPA_URL+'/rest/v1/rpc/'+fn,{method:'POST',
    headers:{'apikey':SUPA_KEY,'Authorization':'Bearer '+SUPA_KEY,'Content-Type':'application/json'},body:JSON.stringify(args)});
  if(!r.ok)throw new Error('HTTP '+r.status);
  return r.json();
}

/* ---------- estado e desenho ---------- */
const E={dados:null,erro:null,anular:{}};
async function carregar(manual){
  if(!TOKEN){E.dados={ok:false,semLink:true};desenhar();return;}
  try{E.dados=await rpc('limpeza_dados',{p_token:TOKEN});E.erro=null;E.quando=new Date();if(manual)toast('Atualizado ✓',1500);}
  catch(e){E.erro=navigator.onLine===false?'Sem internet. Verifique os dados móveis ou o Wi-Fi.':'Não foi possível ligar. Tente de novo daqui a pouco.';if(manual||!E.dados)toast(E.erro,4000);}
  desenhar();
}
function rotuloDia(s,hoje){
  if(s===hoje)return'Hoje';if(s===addD(hoje,1))return'Amanhã';if(s===addD(hoje,-1))return'Ontem';
  const d=new Date(pd(s));return DS[d.getUTCDay()]+', '+d.getUTCDate()+' '+MS[d.getUTCMonth()];
}
const podeComecar=(l,hoje)=>l.data&&l.data>=addD(hoje,-2)&&l.data<=addD(hoje,1);
function desenhar(){
  const d=E.dados,m=$('main');
  if(!d){m.innerHTML=E.erro?`<div class="aviso"><h3>📶 Sem ligação</h3><p>${esc(E.erro)}</p><button class="big" onclick="carregar(true)">Tentar de novo</button></div>`:'';return;}
  if(!d.ok){
    $('ola').textContent='Gestão AL';
    m.innerHTML=`<div class="aviso"><h3>🔒 ${d.semLink?'Falta o link':'Link desativado'}</h3><p>${d.semLink?'Abra o link que recebeu por mensagem (WhatsApp ou SMS).':'Este link já não está ativo. Fale com o responsável para receber um link novo.'}</p></div>`;
    return;
  }
  $('ola').textContent='Olá, '+d.nome;
  const hoje=d.hoje,L=d.limpezas||[];
  const curso=L.filter(l=>l.inicio&&!l.fim);
  const porFazer=L.filter(l=>!l.inicio&&!l.fim&&l.estado!=='feita');
  const atuais=porFazer.filter(l=>podeComecar(l,hoje)&&l.data<=hoje);
  const proximas=porFazer.filter(l=>l.data>hoje);
  const feitas=L.filter(l=>l.fim||l.estado==='feita').sort((a,b)=>a.data<b.data?1:-1);
  let h='';
  if(mostrarBotaoInstalar())h+=`<button class="inst" onclick="instalar()"><span>📲</span>Pôr ícone no telemóvel<small style="margin-left:auto;font-weight:400;color:var(--ink2)">1 toque</small></button>`;
  if(curso.length){h+='<h2>⏳ A decorrer</h2>'+curso.map(l=>cartao(l,hoje,'curso')).join('');}
  if(atuais.length){h+='<h2>🧹 Para fazer</h2>'+atuais.map(l=>cartao(l,hoje,'fazer')).join('');}
  if(!curso.length&&!atuais.length)h+=`<div class="empty" style="margin-top:6px">✅ Não há limpezas para hoje.</div>`;
  if(proximas.length){h+='<h2>📅 Próximas</h2>'+proximas.map(l=>{
    const amanha=l.data===addD(hoje,1);
    return amanha?cartao(l,hoje,'fazer'):`<div class="mini"><span class="dot" style="background:${esc(l.cor||'#2FB5A5')}"></span><b>${esc(l.imovel)}</b><small>${esc(rotuloDia(l.data,hoje))}</small></div>`;}).join('');}
  if(feitas.length){h+='<h2>✅ Feitas (últimas 2 semanas)</h2>'+feitas.map(l=>`<div class="mini"><span class="dot" style="background:${esc(l.cor||'#2FB5A5')}"></span><b>${esc(l.imovel)}</b><small>${esc(rotuloDia(l.data,hoje))}<br>${l.inicio&&l.fim?`${hora(l.inicio)}–${hora(l.fim)} · <span class="ok">${dur(new Date(l.fim)-new Date(l.inicio))}</span>`:'<span class="ok">feita</span>'}</small></div>`).join('');}
  h+=`<p class="rod">${E.quando?'Atualizado às '+hora(E.quando):''}${E.erro?' · <span style="color:var(--red)">sem ligação</span>':''}<br>Gestão AL · só vê as limpezas que lhe foram atribuídas</p>`;
  m.innerHTML=h;
  tique();
}
function cartao(l,hoje,tipo){
  const cor=esc(l.cor||'#2FB5A5');
  let h=`<div class="card" style="border-left-color:${cor}"><div class="top"><span class="im">${esc(l.imovel)}</span><span class="dt">${esc(rotuloDia(l.data,hoje))}</span></div>`;
  if(tipo==='curso'){
    h+=`<div class="st">Começou às <b>${hora(l.inicio)}</b></div><div class="timer" data-ini="${esc(l.inicio)}">—</div>
        <button class="big fim" onclick="pedir('fim','${l.id}')">■ Terminei</button>`;
    if(E.anular[l.id]&&Date.now()-new Date(l.inicio)<15*6e4)h+=`<button class="lnk" onclick="pedir('anular_inicio','${l.id}')">Carreguei por engano — anular</button>`;
  }else if(podeComecar(l,hoje)){
    h+=`<div class="st">Ao chegar ao imóvel, carregue em <b>Comecei</b>.</div><button class="big" onclick="pedir('inicio','${l.id}')">▶ Comecei</button>`;
  }else h+=`<div class="st">Pode carregar em "Comecei" no próprio dia.</div>`;
  return h+'</div>';
}
function tique(){document.querySelectorAll('.timer[data-ini]').forEach(e=>{e.textContent='⏱ '+dur(Date.now()-new Date(e.dataset.ini))});}
setInterval(tique,20000);

/* ---------- carregar nos botões ---------- */
let PED=null;
function pedir(acao,id){
  const l=(E.dados.limpezas||[]).find(x=>x.id===id);if(!l)return;
  PED={acao,id};
  const t={inicio:['▶ Começar agora?',`Vai registar o <b>início</b> da limpeza em <b>${esc(l.imovel)}</b> às <b>${hora(new Date())}</b>.`,'Sim, comecei'],
           fim:['■ Terminar agora?',`Vai registar o <b>fim</b> da limpeza em <b>${esc(l.imovel)}</b> às <b>${hora(new Date())}</b>.`,'Sim, terminei'],
           anular_inicio:['Anular o início?','O registo de início é apagado e volta a aparecer o botão "Comecei".','Anular']}[acao];
  $('cfTit').textContent=t[0];$('cfTxt').innerHTML=t[1];$('cfOk').textContent=t[2];
  $('cfOk').className=acao==='fim'?'red':'pri';
  $('cfNota').classList.toggle('hide',acao!=='fim');$('cfNota').value='';
  $('cfOk').disabled=false;$('cfOk').onclick=confirmar;
  $('mConf').classList.remove('hide');
}
function fecharConf(){$('mConf').classList.add('hide');PED=null;}
async function confirmar(){
  if(!PED)return;const{acao,id}=PED;$('cfOk').disabled=true;
  try{
    const r=await rpc('limpeza_marcar',{p_token:TOKEN,p_tarefa:id,p_acao:acao,p_nota:acao==='fim'?$('cfNota').value:null});
    if(!r.ok){
      const m={link:'Este link já não está ativo.',dia:'Esta limpeza só pode ser registada no próprio dia.',sem_inicio:'Primeiro carregue em "Comecei".',anular:'Já não é possível anular (passaram mais de 15 minutos).',tarefa:'Esta limpeza já não lhe está atribuída.'}[r.erro]||'Não foi possível registar.';
      toast(m,4500);fecharConf();await carregar();return;
    }
    if(acao==='inicio')E.anular[id]=1;else delete E.anular[id];
    fecharConf();
    toast(acao==='inicio'?'Início registado às '+hora(r.inicio)+' ✓':acao==='fim'?'Limpeza terminada ✓ Obrigado!':'Início anulado',3500);
    await carregar();
  }catch(e){$('cfOk').disabled=false;toast(navigator.onLine===false?'Sem internet — nada foi registado. Tente de novo.':'Erro de ligação — nada foi registado. Tente de novo.',5000);}
}

/* ---------- ícone no telemóvel ---------- */
const UA=navigator.userAgent||'';
const IOS=/iPhone|iPad|iPod/.test(UA)||(navigator.platform==='MacIntel'&&navigator.maxTouchPoints>1);
const ANDROID=/Android/i.test(UA);
const APP=()=>window.matchMedia('(display-mode: standalone)').matches||window.navigator.standalone===true;
const DENTRO_APP=/FBAN|FBAV|Instagram|WhatsApp|Line\/|; wv\)/i.test(UA);
let promptInst=null;
if(!IOS){ // no iPhone não se põe o manifesto: assim o ícone guarda o link completo
  const lk=document.createElement('link');lk.rel='manifest';lk.href='limpeza.webmanifest';document.head.appendChild(lk);
  if('serviceWorker' in navigator)navigator.serviceWorker.register('limpeza-sw.js',{scope:'/limpeza'}).catch(()=>{});
}
window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();promptInst=e;desenhar();});
window.addEventListener('appinstalled',()=>{promptInst=null;toast('Ícone criado ✓ Já pode abrir as Limpezas pelo ecrã do telemóvel.',5000);desenhar();});
function mostrarBotaoInstalar(){return!APP()&&(IOS||ANDROID||!!promptInst)&&E.dados&&E.dados.ok;}
async function instalar(){
  if(promptInst){
    promptInst.prompt();
    try{const r=await promptInst.userChoice;if(r&&r.outcome==='accepted'){promptInst=null;desenhar();return;}}catch(e){}
    return;
  }
  let h='';
  if(IOS){
    h=`<ol class="passos">
      <li><div>Em baixo (ou em cima, no iPad), toque no botão <span class="ico">⬆︎</span> <b>Partilhar</b>.</div></li>
      <li><div>Deslize e toque em <b>"Adicionar ao ecrã principal"</b> <span class="ico">＋</span>.</div></li>
      <li><div>Toque em <b>"Adicionar"</b>. Pronto — aparece o ícone <b>Limpezas</b> no ecrã.</div></li></ol>
      <div class="nota">Não vê o botão Partilhar? Abriu o link dentro do WhatsApp: toque primeiro em <b>"Abrir no Safari"</b> (ícone da bússola 🧭 ou nos ⋯) e depois siga os passos.</div>`;
  }else{
    const intent='intent://'+location.host+'/limpeza.html?c='+encodeURIComponent(TOKEN||'')+'#Intent;scheme=https;package=com.android.chrome;end';
    h=`${DENTRO_APP||ANDROID?`<p>Se abriu o link dentro do WhatsApp, abra-o primeiro no Chrome:</p><a class="big" style="text-align:center;text-decoration:none" href="${esc(intent)}">Abrir no Chrome</a>`:''}
      <ol class="passos" style="margin-top:16px">
      <li><div>No Chrome, toque nos <span class="ico">⋮</span> (três pontinhos, em cima à direita).</div></li>
      <li><div>Toque em <b>"Adicionar ao ecrã principal"</b> ou <b>"Instalar app"</b>.</div></li>
      <li><div>Confirme com <b>"Instalar"</b> / <b>"Adicionar"</b>. Pronto — aparece o ícone <b>Limpezas</b>.</div></li></ol>`;
  }
  $('instTxt').innerHTML=h;$('mInst').classList.remove('hide');
}
function fecharInst(){$('mInst').classList.add('hide');}

/* ---------- arranque ---------- */
document.addEventListener('visibilitychange',()=>{if(!document.hidden)carregar();});
setInterval(()=>{if(!document.hidden)carregar();},60000);
carregar();
</script>
</body>
</html>
